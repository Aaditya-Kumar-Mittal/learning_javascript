<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise in JavaScript</title>
</head>
<body>
  <h1>Bitcoin Application</h1>
  <table id="bitcoin-table" border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price (USD)</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <script>
    var data = fetch("https://api.coinlore.net/api/tickers/");
    data.then((response) => {
      return response.json();
    }).then((result) => {
      console.log(result);
      var tableBody = document.getElementById('bitcoin-table').getElementsByTagName('tbody')[0];
      result.data.forEach((coin) => {
        var row = tableBody.insertRow();
        var cell1 = row.insertCell(0);
        var cell2 = row.insertCell(1);
        var cell3 = row.insertCell(2);
        cell1.innerHTML = coin.id;
        cell2.innerHTML = coin.name;
        cell3.innerHTML = `$${coin.price_usd}`;
      });
    }).catch((error) => {
      console.error('Error:', error);
    });
  </script>
</body>
</html>
